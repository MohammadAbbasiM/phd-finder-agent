name: PhD Finder Daily Agent

on:
  schedule:
    # Runs once every 24 hours at 06:17 UTC (~9:47 AM Iran Time)
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: phd-finder-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 curl_cffi google-genai

      - name: Ensure Data Directory Exists
        run: |
          mkdir -p data
          if [ ! -f data/seen_posts.json ]; then echo "[]" > data/seen_posts.json; fi

      - name: Run PhD Finder Agent
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main_cloud.py

      - name: Commit and Push Updated Cache
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          for f in "data/seen_posts.json" "seen_professors.json"; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "No changes to seen cache."
          else
            git commit -m "Auto-update seen posts cache [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
